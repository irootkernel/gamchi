[package]
name = "samchi-adapter-grok"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "fake-acp-agent"
path = "src/bin/fake-acp-agent.rs"

[dependencies]
agent-client-protocol = "2.1.0"
async-process = "2"
futures = "0.3"
libc = "0.2"
samchi-core = { path = "../core" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
